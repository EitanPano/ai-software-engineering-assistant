    template: frontend/react
    version: 2.1.1
    flags: {}
    capabilities: {}
    commands:
      install: bun install
      dev: bun run dev
      check: bun run check
      typecheck: bun run typecheck
      lint: bun run lint
      format: bun run format
      test: bun run test
      testE2e: bun run test:e2e
      contract: bun run api:types
    http:
      port: 5173
      health: /
